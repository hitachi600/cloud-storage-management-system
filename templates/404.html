{% extends 'base.html' %}

{% block title %}Page Not Found - 404{% endblock %}

{% block content %}
<div style="text-align: center; padding: 4rem 1rem; max-width: 600px; margin: 0 auto;">
    <div style="font-size: 5rem; font-weight: 800; line-height: 1; margin-bottom: 1rem;" class="gradient-text">
        404
    </div>
    <h2 style="font-size: 1.8rem; margin-bottom: 1rem;">{{ error_title or "Page Not Found" }}</h2>
    <p style="color: var(--text-secondary); margin-bottom: 2rem;">
        {{ error_message or "The page or file you are looking for does not exist or has been moved." }}
    </p>
    <a href="{{ url_for('pages.home') }}" class="btn btn-primary">
        <i class="fa-solid fa-house"></i> Return to Homepage
    </a>
</div>
{% endblock %}
